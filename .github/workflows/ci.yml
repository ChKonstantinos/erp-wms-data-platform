name: ERP WMS CI

on:
  push:
  pull_request:

jobs:
  python-checks:
    name: Python Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: python -m compileall -q src

      - name: Check Airflow DAG syntax
        run: python -m compileall -q airflow/dags

      - name: Install dbt
        run: pip install dbt-core==1.11.0 dbt-postgres==1.11.0

      - name: Validate dbt project
        env:
          DB_USER: ci_user
          DB_PASSWORD: ci_placeholder
        run: |
          dbt parse \
            --project-dir erp_wms_dbt \
            --profiles-dir erp_wms_dbt/docker_profile